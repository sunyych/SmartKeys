name: Apple build checks

on:
  push:
    branches: [main, feature/mobile-launcher-and-editions, feature/app-icon-library, codex/unified-app-library]
    paths:
      - 'ios/**'
      - 'desktop_companion/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - 'packages/local_dictation/**'
      - 'packages/lumiakeys_protocol/**'
      - 'packages/diagnostics_core/**'
      - 'packages/app_icon_catalog/**'
      - 'packages/app_library/**'
      - 'scripts/generate_app_icon_catalog.py'
      - 'scripts/generate_app_library.py'
      - 'scripts/sync_diagnostics_core.py'
      - '.github/workflows/ios-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-debug:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Check generated catalogs and shared diagnostics
        run: |
          python3 scripts/generate_app_icon_catalog.py --check
          python3 scripts/generate_app_library.py --check
          python3 scripts/sync_diagnostics_core.py --check
      - name: Build unsigned iOS app
        run: flutter build ios --debug --no-codesign --target lib/main.dart --dart-define=LUMIAKEY_EDITION=regular
      - name: Upload unsigned Regular app
        run: |
          apps=(build/ios/iphoneos/*.app)
          test -d "${apps[0]}"
          ditto -c -k --sequesterRsrc --keepParent "${apps[0]}" build/ios/LumiaKey-Regular-iOS-unsigned.zip
      - name: Save unsigned Regular app artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-regular-unsigned
          path: build/ios/LumiaKey-Regular-iOS-unsigned.zip
          if-no-files-found: error

  macos-desktop:
    name: macOS Desktop release package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Test the Rust desktop library
        working-directory: desktop_companion
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo test --locked --manifest-path native/windows_shortcuts/Cargo.toml --target-dir build/rust-desktop-tests
      - name: Build and package Desktop
        working-directory: desktop_companion
        run: |
          flutter pub get
          product_version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          build_name=${product_version%%+*}
          build_number=${product_version##*+}
          flutter build macos --release --build-name="$build_name" --build-number="$build_number"
          export LUMIAKEY_TEST_DESKTOP_NATIVE_LIBRARY="$PWD/build/macos/Build/Products/Release/LumiaKey.app/Contents/Frameworks/liblumiakeys_desktop.dylib"
          test -s "$LUMIAKEY_TEST_DESKTOP_NATIVE_LIBRARY"
          codesign --verify "$LUMIAKEY_TEST_DESKTOP_NATIVE_LIBRARY"
          flutter test --no-pub test/rust_macos_*_test.dart
          mkdir -p dist/dmg
          cp -R "build/macos/Build/Products/Release/LumiaKey.app" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "LumiaKey $build_name" -srcfolder dist/dmg -ov -format UDZO "dist/LumiaKey-macOS-v$build_name.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-desktop-dmg
          path: desktop_companion/dist/*.dmg
          if-no-files-found: error
