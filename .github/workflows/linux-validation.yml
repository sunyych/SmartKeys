name: Full LumiaKey Linux build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - "desktop_companion/**"
      - "packages/lumiakeys_protocol/**"
      - ".github/workflows/linux-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Full Linux desktop app
        working-directory: desktop_companion
        run: |
          flutter pub get
          flutter build linux --release
          mkdir -p dist
          tar -czf dist/LumiaKey-Linux-x86_64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: lumiakey-full-linux-x86_64
          path: desktop_companion/dist/LumiaKey-Linux-x86_64.tar.gz
          if-no-files-found: error
