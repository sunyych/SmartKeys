name: Full LumiaKey Linux build

on:
  push:
    branches: [main, feature/mobile-launcher-and-editions, feature/app-icon-library, codex/unified-app-library, codex/host-switch-pointer-and-sidebar]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
    paths:
      - "desktop_companion/**"
      - "packages/lumiakeys_protocol/**"
      - "apps/bluetooth/scripts/prepare_screenshot_font.py"
      - "apps/bluetooth/scripts/test_prepare_screenshot_font.py"
      - ".github/workflows/linux-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter Linux build libraries
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sources="$(mktemp --suffix=.sources "$RUNNER_TEMP/lumiakeys-ubuntu.XXXXXX")"
          trap 'rm -f "$sources"' EXIT
          cat > "$sources" <<'EOF'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu/
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu/
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          chmod 0644 "$sources"

          apt=(sudo --preserve-env=DEBIAN_FRONTEND apt-get
            -o "Dir::Etc::sourcelist=$sources" -o Dir::Etc::sourceparts=-
            -o Acquire::Retries=0 -o Acquire::Languages=none
            -o Acquire::http::Timeout=12 -o Acquire::https::Timeout=12)
          packages=(clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
            libxcb1-dev libxcb-xtest0-dev libayatana-appindicator3-dev libasound2-dev
            libpulse-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
            gstreamer1.0-tools gstreamer1.0-plugins-good pulseaudio pulseaudio-utils
            xdotool playerctl brightnessctl xvfb xauth)
          install_args=(--no-install-recommends -y "${packages[@]}")

          # Try the runner's cached Ubuntu indexes before refreshing them.
          if ! timeout --kill-after=5s 45s "${apt[@]}" install --download-only "${install_args[@]}"; then
            timeout --kill-after=5s 120s "${apt[@]}" update --error-on=any
            timeout --kill-after=5s 150s "${apt[@]}" install --download-only "${install_args[@]}"
          fi
          timeout --kill-after=10s 120s "${apt[@]}" install --no-download "${install_args[@]}"
      - name: Prepare verified screenshot font
        timeout-minutes: 4
        run: |
          screenshot_font="$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          python3 -m unittest discover -s apps/bluetooth/scripts -p test_prepare_screenshot_font.py
          python3 apps/bluetooth/scripts/prepare_screenshot_font.py --output "$screenshot_font" --github-env "$GITHUB_ENV"
          test -s "$screenshot_font"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Resolve and analyze Full Linux desktop app
        working-directory: desktop_companion
        run: |
          flutter precache --linux
          flutter pub get
          flutter analyze
      - name: Test with an isolated virtual PulseAudio sink
        working-directory: desktop_companion
        env:
          SMARTKEYS_LINUX_AUDIO_TEST: '1'
        run: |
          set -euo pipefail
          material_icon_font="${FLUTTER_ROOT:?}/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          test -s "$material_icon_font"
          test -s "$SMARTKEYS_SCREENSHOT_FONT"
          ls -l "$material_icon_font" "$SMARTKEYS_SCREENSHOT_FONT"
          audio_dir="$(mktemp -d "$RUNNER_TEMP/lumiakey-pulse.XXXXXX")"
          export PULSE_RUNTIME_PATH="$audio_dir"
          export PULSE_STATE_PATH="$audio_dir/state"
          export PULSE_SERVER="unix:$audio_dir/native"
          pulseaudio --daemonize=no --use-pid-file=no --exit-idle-time=-1 --disable-shm=yes -n \
            -L "module-native-protocol-unix socket=$audio_dir/native auth-anonymous=1" \
            > "$audio_dir/server.log" 2>&1 &
          pulse_pid=$!
          cleanup_audio() {
            result=$?
            trap - EXIT
            kill "$pulse_pid" 2>/dev/null || true
            wait "$pulse_pid" 2>/dev/null || true
            cat "$audio_dir/server.log"
            exit "$result"
          }
          trap cleanup_audio EXIT
          ready=0
          for attempt in {1..50}; do
            if pactl info > "$audio_dir/info.log" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$pulse_pid" 2>/dev/null; then
              echo 'The isolated CI PulseAudio server exited before becoming ready.' >&2
              exit 1
            fi
            sleep 0.1
          done
          if [ "$ready" -ne 1 ]; then
            echo 'The isolated CI PulseAudio server did not become ready.' >&2
            exit 1
          fi
          pactl load-module module-null-sink sink_name=lumiakey_ci_null channels=2 rate=48000
          pactl set-default-sink lumiakey_ci_null
          pactl set-sink-mute lumiakey_ci_null 0
          LC_ALL=C pactl info
          LC_ALL=C pactl list short sinks | tee "$audio_dir/sinks.log"
          grep -q 'lumiakey_ci_null' "$audio_dir/sinks.log"
          xvfb-run -a flutter test
      - name: Test the Rust desktop library
        working-directory: desktop_companion
        run: cargo test --locked --manifest-path native/windows_shortcuts/Cargo.toml --target-dir build/rust-desktop-tests
      - name: Build Full Linux desktop app
        working-directory: desktop_companion
        run: |
          flutter build linux --release
          export LUMIAKEY_TEST_DESKTOP_NATIVE_LIBRARY="$PWD/build/linux/x64/release/bundle/lib/liblumiakeys_desktop.so"
          test -s "$LUMIAKEY_TEST_DESKTOP_NATIVE_LIBRARY"
          xvfb-run -a env -u WAYLAND_DISPLAY XDG_SESSION_TYPE=x11 LUMIAKEY_TEST_LINUX_EXPECT_X11=1 \
            flutter test --no-pub test/rust_linux_*_test.dart
          mkdir -p dist
          tar -czf dist/LumiaKey-Linux-x86_64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: lumiakey-full-linux-x86_64
          path: desktop_companion/dist/LumiaKey-Linux-x86_64.tar.gz
          if-no-files-found: error
