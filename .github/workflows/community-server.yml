name: community-server

on:
  push:
    paths:
      - "community_server/**"
      - "packages/app_icon_catalog/**"
      - "scripts/generate_app_icon_catalog.py"
      - "scripts/test_generate_app_icon_catalog.py"
      - ".github/workflows/community-server.yml"
  pull_request:
    paths:
      - "community_server/**"
      - "packages/app_icon_catalog/**"
      - "scripts/generate_app_icon_catalog.py"
      - "scripts/test_generate_app_icon_catalog.py"
      - ".github/workflows/community-server.yml"

jobs:
  rust-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartkeys_test
          POSTGRES_USER: smartkeys_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartkeys_test -d smartkeys_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://smartkeys_test:ci_test_password@127.0.0.1:5432/smartkeys_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify canonical artwork and all generated application/server mirrors
        run: |
          python scripts/generate_app_icon_catalog.py --check
          python -m unittest scripts/test_generate_app_icon_catalog.py
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path community_server/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path community_server/Cargo.toml --locked --all-targets -- -D warnings
      - name: Unit and PostgreSQL HTTP integration tests
        run: cargo test --manifest-path community_server/Cargo.toml --locked --all-targets -- --include-ignored
      - name: Verify self-contained Docker context
        run: docker build --tag lumiakey-community-icons:ci community_server
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser verification tools
        run: |
          npm install --prefix build/web-review --no-save --ignore-scripts playwright@1.62.1
          ./build/web-review/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify icon downloads, mobile layout, and error recovery
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/build/web-review/node_modules/playwright
          SMARTKEYS_SCREENSHOT_DIR: ${{ github.workspace }}/build/current-product-screenshots
          ICON_BASE_URL: http://127.0.0.1:18741
          LISTEN_ADDR: 127.0.0.1:18741
        run: |
          cargo build --manifest-path community_server/Cargo.toml --locked
          community_server/target/debug/smartkeys-community-server --icons-preview &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$ICON_BASE_URL/v1/icons/catalog" >/dev/null; then break; fi
            sleep 1
          done
          node community_server/tests/browser_icons.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: current-icon-web-screenshots
          path: build/current-product-screenshots/
          if-no-files-found: error
