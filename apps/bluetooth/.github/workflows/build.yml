name: Standalone Bluetooth Lite verification
on:
  push:
    branches: [main, feature/app-icon-library]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      SMARTKEYS_SCREENSHOT_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Prepare screenshot fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          flutter precache --linux
          test -f "$SMARTKEYS_SCREENSHOT_FONT"
          test -f "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          ls -l "$SMARTKEYS_SCREENSHOT_FONT" "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
      - name: Verify standalone source and build
        env:
          SMARTKEYS_SCREENSHOT_DIR: ${{ github.workspace }}/build/ui_screenshots
        run: |
          python3 scripts/check_isolation.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
          ./android/gradlew -p android :app:testDebugUnitTest
          python3 scripts/check_isolation.py --apk build/app/outputs/flutter-apk/app-debug.apk
          dart run scripts/generate_screenshot_index.dart --root build/ui_screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: bluetooth-lite-debug-and-screenshots
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/ui_screenshots/
          if-no-files-found: error
