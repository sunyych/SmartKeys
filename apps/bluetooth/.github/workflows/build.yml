name: Standalone Bluetooth Lite verification
on:
  push:
    branches: [main, feature/app-icon-library, codex/lite-bluetooth-full-interface]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          cache: true
      - name: Prepare screenshot fonts
        timeout-minutes: 8
        run: |
          screenshot_font="$RUNNER_TEMP/NotoSansCJKsc-Regular.otf"
          python3 -m unittest discover -s scripts -p test_prepare_screenshot_font.py
          python3 scripts/prepare_screenshot_font.py --output "$screenshot_font" --github-env "$GITHUB_ENV"
          flutter precache --linux
          test -s "$screenshot_font"
          test -s "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          ls -l "$screenshot_font" "$FLUTTER_ROOT/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
      - name: Verify standalone source and build
        env:
          SMARTKEYS_SCREENSHOT_DIR: ${{ github.workspace }}/build/ui_screenshots
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 scripts/check_isolation.py
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --debug
          ./android/gradlew -p android :app:testDebugUnitTest
          python3 scripts/check_isolation.py --apk build/app/outputs/flutter-apk/app-debug.apk
          dart run scripts/generate_screenshot_index.dart --root build/ui_screenshots
      - uses: actions/upload-artifact@v7
        with:
          name: bluetooth-lite-debug-and-screenshots
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/ui_screenshots/
          if-no-files-found: error
