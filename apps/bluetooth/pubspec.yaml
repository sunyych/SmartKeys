name: lumiakey_bluetooth_lite
description: Standalone Android Bluetooth HID keyboard, mouse, media controls, and local shortcuts.
publish_to: none
version: 1.2.0+3
environment:
  sdk: ^3.12.1
dependencies:
  diagnostics_core:
    path: packages/diagnostics_core
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.7.2
flutter:
  uses-material-design: true
  assets:
    - assets/app_icon/app_icon_source.png
    - assets/app_icons/
